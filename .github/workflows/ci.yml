name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/Backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: typing_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/typing_platform?schema=public"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/typing_platform?schema=public"
      JWT_SECRET: "ci-only-secret-not-used-in-production"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/Backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test --runInBand
      - run: pnpm exec prisma migrate deploy
      - run: bash test/text-type-recovery.sh
      - run: pnpm run test:e2e --runInBand

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/Frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
